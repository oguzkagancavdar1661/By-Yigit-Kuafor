<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli | BY YİĞİT KUAFÖR</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-page {
            background-color: var(--bg-dark);
            min-height: 100vh;
            padding: 40px 0 80px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 36px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: var(--radius-md);
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: var(--transition);
        }

        .metric-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-3px);
        }

        .metric-icon-box {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-sm);
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-color);
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .metric-content h4 {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-content .val {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-white);
            line-height: 1;
        }

        .filter-toolbar {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filter-item {
            flex: 1;
            min-width: 180px;
        }

        .admin-table-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow-x: auto;
            box-shadow: var(--shadow-card);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .admin-table th {
            background: rgba(10, 12, 16, 0.95);
            padding: 16px 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-light);
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
        }

        .admin-table td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .admin-table tr:hover td {
            background: rgba(212, 175, 55, 0.02);
        }

        .badge-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-confirmed {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-completed {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .action-buttons-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .btn-act-complete {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .btn-act-complete:hover {
            background: #10b981;
            color: #000;
        }

        .btn-act-whatsapp {
            background: rgba(37, 211, 102, 0.2);
            color: #25d366;
        }
        .btn-act-whatsapp:hover {
            background: #25d366;
            color: #fff;
        }

        .btn-act-cancel {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        .btn-act-cancel:hover {
            background: #f59e0b;
            color: #000;
        }

        .btn-act-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .btn-act-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        @media (max-width: 992px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            .filter-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body class="admin-page">

    <div class="container">
        <!-- Admin Top Bar -->
        <header class="admin-header">
            <div class="brand-logo">
                <div class="brand-icon-box">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <div class="brand-text">
                    <h1>BY YİĞİT <span>KUAFÖR</span></h1>
                    <p>Yönetici & Randevu Paneli</p>
                </div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <a href="/" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-arrow-left"></i> Web Sitesine Dön
                </a>
                <button id="btnExportCsv" class="btn btn-gold btn-sm">
                    <i class="fa-solid fa-file-excel"></i> Excel / CSV İndir
                </button>
            </div>
        </header>

        <!-- KPI Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon-box">
                    <i class="fa-solid fa-calendar-day"></i>
                </div>
                <div class="metric-content">
                    <h4>Bugünkü Randevular</h4>
                    <div class="val" id="metricTodayCount">0</div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon-box">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div class="metric-content">
                    <h4>Toplam Randevu</h4>
                    <div class="val" id="metricTotalCount">0</div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon-box">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="metric-content">
                    <h4>Tamamlanan</h4>
                    <div class="val" id="metricCompletedCount">0</div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon-box">
                    <i class="fa-solid fa-turkish-lira-sign"></i>
                </div>
                <div class="metric-content">
                    <h4>Toplam Ciro Hacmi</h4>
                    <div class="val" id="metricTotalRevenue" style="color:var(--gold-primary);">0 ₺</div>
                </div>
            </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="filter-toolbar">
            <div class="filter-item">
                <input type="text" id="searchCustomer" class="form-control" placeholder="Müşteri adı, tel veya kod ara...">
            </div>
            <div class="filter-item">
                <input type="date" id="filterDate" class="form-control">
            </div>
            <div class="filter-item">
                <select id="filterStatus" class="form-control">
                    <option value="">Tüm Durumlar</option>
                    <option value="Onaylandı">Onaylandı</option>
                    <option value="Tamamlandı">Tamamlandı</option>
                    <option value="İptal Edildi">İptal Edildi</option>
                </select>
            </div>
            <div>
                <button id="btnResetFilters" class="btn btn-outline btn-sm" style="padding:13px 18px;">
                    <i class="fa-solid fa-rotate-right"></i> Sıfırla
                </button>
            </div>
        </div>

        <!-- Appointments Table -->
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Randevu Kodu</th>
                        <th>Müşteri Bilgisi</th>
                        <th>Hizmet & Tutar</th>
                        <th>Tarih & Saat</th>
                        <th>Durum</th>
                        <th>Notlar</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center; padding: 40px; color: var(--text-muted);">
                            <i class="fa-solid fa-spinner fa-spin"></i> Randevular yükleniyor...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/admin.js"></script>
</body>
</html>
